<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>

        <header>

            <div class="logo">
                Character Counter
            </div>

            <button class="sett-btn">

            </button>

        </header>

        <main>

            <section class="">

                <h1>
                    Analyze your text
                    in real-time.
                </h1>

                <textarea placeholder="start typing..."></textarea>

                <div class="control">

                    <div>


                        <input type="checkbox">
                        set character limit

                    </div>

                    <p>Approx. reading time: &lt;1 minute</p>

                </div>

            </section>

            <section>
                <article>
                    <h2>278</h2>
                    <p>total characters</p>
                </article>
                
                <article>
                    <h2>39</h2>
                    <p>Word Count</p>
                </article>

                <article>
                    <h2>04</h2>
                    <p>Sentence Count</p>
                </article>

            </section>

            <section class="density">

                <h3>Letter density</h3>

                <div class="row">
                    <span>E</span>
                    <div class="bar">
                        <div class=""></div>
                    </div>
                    <span>40 (16.06%)</span>
                </div>

                <div class="row">
                    <span>I</span>
                    <div class="bar">
                        <div></div>
                    </div>
                    <span>29 (11.65%)</span>
                </div>

                <div class="row">
                    <span>T</span>
                    <div class="bar">
                        <div class=""></div>
                    </div>
                    <span>28 (11.24%)</span>
                </div>

                <div class="row">
                    <span>O</span>
                    <div class="bar">
                        <div class=""></div>
                    </div>
                    <span>22 (8.84%)</span>
                </div>

                <div class="row">
                    <span>N</span>
                    <div class="bar">
                        <div class=""></div>
                    </div>
                    <span>21 (8.43%)</span>
                </div>

                <div class="see-more">
                    <a href="">
                        See more
                        <span class="arrow">⌄</span>
                    </a>
                        
                </div>
            </section>
        </main>


    </div>
  
</body>
</html>
