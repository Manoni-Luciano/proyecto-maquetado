<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googlepis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>
<body>

    <div class="container">

        <header>

            <div class="logo">
                Character Counter
            </div>

            <button class="sett-btn">

            </button>
            

        </header>

        <main>

            <section class="title">

                <h1>
                    Analyze your text
                    in real-time.
                </h1>

                <textarea placeholder="start typing..."></textarea>

                <div class="controls">

                    <div class="checkboxes">

                        <label>
                            <input type="checkbox">
                            Exclude Spaces
                        </label>

                        <label>
                            <input type="checkbox">
                             set character limit
                        </label>

                    </div>

                    <p>Approx. reading time: &lt;1 minute</p>

                </div>

            </section>

            <section class="stats">

                <article class="card">
                    <img src="/assets/purple.png" alt="card purple">

                    <div class="card-info">
                        <h2>278</h2>
                        <p>total characters</p>
                    </div>
                </article>
                
                <article class="card">
                    <img src="/assets/orange.png" alt="card orange">

                    <div class="card-info">
                        <h2>39</h2>
                        <p>Word Count</p>
                    </div>
                    
                </article>

                <article class="card">
                    <img src="/assets/coral.png" alt="card coral">

                    <div class="card-info">
                        <h2>04</h2>
                        <p>Sentence Count</p>
                    </div>
                    
                </article>

            </section>

            <section class="density">

                <h3>Letter density</h3>

                <div class="row">
                    <span>E</span>
                    <div class="bar">
                        <div class="fill-e"></div>
                    </div>
                    <span>40 (16.06%)</span>
                </div>

                <div class="row">
                    <span>I</span>
                    <div class="bar">
                        <div class="fill-i"></div>
                    </div>
                    <span>29 (11.65%)</span>
                </div>

                <div class="row">
                    <span>T</span>
                    <div class="bar">
                        <div class="fill-t"></div>
                    </div>
                    <span>28 (11.24%)</span>
                </div>

                <div class="row">
                    <span>O</span>
                    <div class="bar">
                        <div class="fill-o"></div>
                    </div>
                    <span>22 (8.84%)</span>
                </div>

                <div class="row">
                    <span>N</span>
                    <div class="bar">
                        <div class="fill-n"></div>
                    </div>
                    <span>21 (8.43%)</span>
                </div>

                <div class="see-more">
                    <a href="#">
                        See more
                        <span class="arrow">⌄</span>
                    </a>
                        
                </div>
            </section>
        </main>


    </div>
  
</body>
</html>
